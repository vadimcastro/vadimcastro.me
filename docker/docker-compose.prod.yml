# docker/docker-compose.prod.yml
services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://vadimcastro.me

  api:
    build:
      dockerfile: docker/Dockerfile
      context: ..
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-unknown}
        GIT_COMMIT_MESSAGE: ${GIT_COMMIT_MESSAGE:-unknown}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-unknown}
    command: >
      sh -c '
        echo "Running migrations..." &&
        /app/scripts/migrate.sh &&
        sleep 3 &&
        echo "Initializing database..." &&
        python3 /app/scripts/init_db.py || echo "Database init failed, continuing..." &&
        echo "Starting production server..." &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      '
    ports:
      - "8000:8000"
    env_file:
      - ../.env.production.local
    environment:
      - PYTHONPATH=/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    env_file:
      - ../.env.production.local
    volumes:
      - vadimcastro_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - vadimcastro_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  vadimcastro_prod_postgres_data:
  vadimcastro_prod_redis_data: